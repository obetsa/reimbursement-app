services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reimbursement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345678}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./migrations/schema_pg.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reimbursement"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: obetsa/reimbursement-app:latest
    ports:
      - "5500:5500"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-12345678}@db/reimbursement

      # Flask
      SECRET_KEY: ${SECRET_KEY}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      REDIRECT_URI: ${REDIRECT_URI:-http://localhost:5500/auth/callback}

      # SMTP (Gmail)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}

      # Superadmin panel token
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - app-data:/app/data

volumes:
  db-data:
  app-data:
