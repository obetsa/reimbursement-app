services:

  db:
    image: postgres:16-alpine
    container_name: reimbursement-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reimbursement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345678}
    volumes:
      - /volume1/docker/reimbursement-app/db-data:/var/lib/postgresql/data
      # Міграції більше не монтуються сюди — їх накатує сам app при старті (migrations/runner.py),
      # нічого окремо копіювати на NAS не треба.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reimbursement"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: obetsa/reimbursement-app:latest
    container_name: reimbursement-app
    ports:
      - "8743:5500"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-12345678}@db/reimbursement

      # Flask
      SECRET_KEY: ${SECRET_KEY}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      REDIRECT_URI: ${REDIRECT_URI}

      # SMTP (Gmail)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}

      # Superadmin panel token
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - /volume1/docker/reimbursement-app/app-data:/app/data
